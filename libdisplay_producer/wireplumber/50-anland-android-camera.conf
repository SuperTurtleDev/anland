# Android's Qualcomm camera-control and video-codec nodes are not V4L2
# capture devices. Probing them can fail before the exported PipeWire device
# becomes bound and stall WirePlumber's device activation / event dispatch.
#
# Match the udev sysfs identity, which is available before device activation.
# Do not match /dev/videoN: numbering changes and USB webcams also use it.
# Anland's own cameras are PipeWire Video/Source nodes and do not use this
# monitor. Normal V4L2 capture devices and libcamera stay enabled.
#
# WirePlumber 0.5.16 / 0.5.17 need the upstream disabled-device transition fix
# (65519a1ff7ce), or an upgrade to 0.5.18+, before using device.disabled rules.
monitor.v4l2.rules = [
  {
    matches = [
      {
        device.sysfs.path = "~^/devices/platform/(.*/)?[^/]*qcom,(cam-req-mgr|cam-sync|vidc)/video4linux/video[0-9]+$"
      }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
]
