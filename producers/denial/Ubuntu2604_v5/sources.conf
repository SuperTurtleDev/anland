# Selected inputs for the Ubuntu 26.04 (resolute) ARM64 Denial producer.
#
# The integration is based on main's v0.6.0 release commit. Set
# DENIAL_COMMIT to another commit, or explicitly empty it to follow main.
# Flutter, Skia and depot_tools stay pinned by Denial's own SOURCE_LOCK.json.

DENIAL_URL="${DENIAL_URL:-https://github.com/denialwm/denial.git}"
DENIAL_BRANCH="${DENIAL_BRANCH:-main}"
DENIAL_COMMIT="${DENIAL_COMMIT-d65792d4309a93f2a4877bfc16bc96df6151506c}"

# Upstream tooling entry points used by build.sh (read from the checkout).
DENIAL_FLUTTER_TOOL="${DENIAL_FLUTTER_TOOL:-tools/denial-flutter-engine}"
DENIAL_PC_TOOL="${DENIAL_PC_TOOL:-tools/denial-pc}"
DENIAL_STAGE_TOOL="${DENIAL_STAGE_TOOL:-tools/stage-denial-runtime}"
DENIAL_DEB_TOOL="${DENIAL_DEB_TOOL:-tools/package-denial-deb}"

# Distributions and source packaging.
UBUNTU_RELEASE="${UBUNTU_RELEASE:-26.04}"
UBUNTU_CODENAME="${UBUNTU_CODENAME:-resolute}"
PKG_ARCH="${PKG_ARCH:-arm64}"

# Xwayland source version. Empty means "whatever apt currently offers";
# a value pins the source package and keeps xwayland.patch applicable.
XWAYLAND_PACKAGE="${XWAYLAND_PACKAGE:-xwayland}"
XWAYLAND_VERSION="${XWAYLAND_VERSION:-2:24.1.10-1}"
XWAYLAND_ANLAND_REVISION="${XWAYLAND_ANLAND_REVISION:-anland1}"
