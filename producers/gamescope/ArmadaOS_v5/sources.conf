# ArmadaOS Fedora 44 Gamescope source layout.
# All source trees are supplied by the caller; the build recipe never downloads.
#
# The Gamescope tree must contain the Terra/Armada gamescope sources matching the
# RPM recipe used by ArmadaOS. Dependencies are normally already materialized by
# that recipe; this file documents the expected embedded paths.
. ${GAMESCOPE_SOURCE}

# Documentary layout only: build.sh validates CACHE/source and its pinned
# submodules directly; GAMESCOPE_SOURCE is not a build.sh input.
# The canonical backend and public producer links are dereferenced into one
# self-contained overlay archive, then compiled into Gamescope exactly once.
anland_backend gamescope
